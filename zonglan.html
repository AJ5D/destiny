<style>
/* 版面：上方輸入一次生辰；接著是「好幾個系統都說你」的共同主題；下方五張卡片並排，各系統一句重點，再點進完整頁面 */
/* 配色：和首頁一致的近白底、炭黑字；五個系統各用首頁線束的一個顏色當識別，固定淺色 */
:root {
  --paper: #FAFAF8; --surface: #FFFFFF; --ink: #2B2B2B; --muted: #666663; --rule: #E2E2DE;
  --accent: #2C6B5E; --accent-soft: #E1ECE8; --mark: #B0432D;
  --s-bazi: #3B7A4C; --s-ziwei: #8A4FA0; --s-star: #3FA4E0; --s-hd: #D4A72C; --s-tarot: #E8577E;
  --wood: #3B7A4C; --fire: #B5432D; --earth: #9A7426; --metal: #6F757E; --water: #2C5888;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px }
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 28px }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.3 }
p { margin: 0 }
.label { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500 }
.hint { font-size: 13px; color: var(--muted) }
.sample-tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); letter-spacing: .08em }

header { display: grid; gap: 8px }
header h1 { font-size: clamp(32px, 7vw, 44px); font-weight: 900; letter-spacing: .04em }
header p { color: var(--muted); max-width: 36em }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; display: grid; gap: 16px; min-width: 0 }
.sec-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between }
.sec-h h2 { font-size: 22px }

.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px }
.form > div { display: grid; gap: 4px; min-width: 0; align-content: start }
input[type="text"], input[type="date"], select {
  font: inherit; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); width: 100% }
input:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
select:disabled { opacity: .5 }
.time24 { display: flex; align-items: center; gap: 6px }
.time24 select { flex: 1; min-width: 0 }
.seg { display: flex; gap: 8px }
.seg label { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); cursor: pointer }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500 }
.seg input { accent-color: var(--accent) }
.checks { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--muted) }
.checks label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer }
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
button { font: inherit; font-weight: 500; border-radius: 4px; padding: 10px 24px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--surface) }
.err { color: var(--mark); font-size: 14px }

/* 共同主題 */
.themes { display: grid; gap: 14px }
.theme { display: grid; gap: 6px; align-content: start; padding: 16px; border-radius: 6px; background: var(--paper); border: 1px solid var(--rule); min-width: 0 }
.theme .rank { font-size: 12px; letter-spacing: .14em; color: var(--muted) }
.theme b { font-family: var(--f-display); font-weight: 900; font-size: clamp(26px, 4.6vw, 34px); line-height: 1.2 }
.theme p { font-size: 14px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); white-space: nowrap }
.lede { font-size: 15px }

/* 系統卡片 */
.systems { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
.sys { display: grid; gap: 8px; align-content: start; padding: 18px; border-radius: 6px; background: var(--surface); border: 1px solid var(--rule); border-top: 4px solid var(--c); min-width: 0 }
.sys .name { font-size: 13px; letter-spacing: .14em; color: var(--c); font-weight: 700 }
.sys b { font-family: var(--f-display); font-weight: 900; font-size: clamp(20px, 3.4vw, 26px); line-height: 1.3 }
.sys p { font-size: 14px; color: var(--muted) }
.sys .more { justify-self: start; font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: .06em; margin-top: 4px }
.sys .more::after { content: " ›››" }
.sys .more:hover { text-decoration: underline }
.sys.na b { color: var(--muted); font-size: 18px }
.sys .tags { display: flex; flex-wrap: wrap; gap: 6px }
.sys .tags span { font-size: 12px; padding: 0 8px; border-radius: 3px; background: var(--paper); color: var(--muted) }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--rule); padding-left: 12px }

footer { font-size: 13px; color: var(--muted); display: grid; gap: 6px }

@media (max-width: 640px) {
  .form, .systems { grid-template-columns: 1fr }
  .themes { grid-template-columns: 1fr !important }
}

/* 網站導覽列：固定在頂端，左邊回首頁，右邊切換工具 */
.sitebar { position: fixed; inset: 0 0 auto; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--rule);
  padding-top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.sitebar .in { max-width: 880px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 12px }
.sitebar .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; white-space: nowrap; padding: 6px 12px 6px 8px; margin-left: -8px; border-radius: 999px }
.sitebar .brand:hover { background: var(--paper) }
.sitebar .brand .ar { font-size: 18px; line-height: 1 }
.sitebar .brand b { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: .18em }
.sitebar .brand b i { font-style: normal; color: #B0432D }
.sitebar nav { margin-left: auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none }
.sitebar nav a { padding: 6px 12px; font-size: 14px; color: var(--muted); text-decoration: none; border-radius: 999px; white-space: nowrap }
.sitebar nav a:hover { color: var(--ink) }
.sitebar nav a[aria-current="page"] { color: var(--surface); background: var(--ink) }
.sitebar a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
body { padding-top: calc(54px + 28px + env(safe-area-inset-top, 0px)) }
@media (max-width: 480px) {
  .sitebar .in { gap: 4px }
  .sitebar .brand { padding-right: 8px }
  .sitebar .brand b { font-size: 16px; letter-spacing: .1em }
  .sitebar nav a { padding: 6px 7px; font-size: 13px }
  .sitebar .brand .ar { display: none }
}

/* 頁首線束：和首頁主視覺同一組顏色，靜止、較淡，往下淡出，只當頁首背景 */
.threads-bg { position: absolute; left: 0; right: 0; top: calc(54px + env(safe-area-inset-top, 0px)); height: 190px; width: 100%; z-index: 0; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, #000 65%, transparent); mask-image: linear-gradient(to bottom, #000 65%, transparent) }
.wrap { position: relative; z-index: 1 }
</style>

<div class="wrap">
  <header>
    <span class="label">八字 × 紫微 × 星座 × 人類圖 × 塔羅</span>
    <h1>命盤總覽</h1>
    <p>輸入一次生辰，一頁看完你在五個系統裡的樣子。<br>不同的系統用不同的語言，當它們說到同一件事，那多半就是你。</p>

  <section class="panel" aria-labelledby="in-h">
    <div class="sec-h"><h2 id="in-h">出生資料</h2><span class="sample-tag" id="sampleTag">範例生辰</span></div>
    <div class="form">
      <div><label for="nm" class="label">姓名（可留空）</label><input id="nm" type="text" maxlength="12" placeholder="例如：小明"></div>
      <div><span class="label" id="sex-l">性別（紫微和八宅命卦會用到）</span>
        <div class="seg" role="radiogroup" aria-labelledby="sex-l">
          <label><input type="radio" name="sex" id="sexF" value="女" checked> 女</label>
          <label><input type="radio" name="sex" id="sexM" value="男"> 男</label>
        </div></div>
      <div><label for="bd" class="label">出生日期（國曆）</label><input id="bd" type="date" min="1901-01-01" max="2099-12-31"></div>
      <div><label for="btH" class="label">出生時間（24 小時制）</label>
        <div class="time24"><select id="btH" aria-label="時"></select><span aria-hidden="true">:</span><select id="btM" aria-label="分"></select></div></div>
      <div><label for="city" class="label">出生地</label><select id="city"></select></div>
    </div>
    <div class="checks">
      <label><input id="noTime" type="checkbox"> 不知道出生時間</label>
      <label><input id="remember" type="checkbox"> 記住在這台裝置</label>
    </div>
    <div class="btns"><button id="calcBtn">一次看完</button><span class="err" id="err" aria-live="polite"></span></div>
  </section>

  <div id="out" style="display:grid;gap:28px" aria-live="polite"></div>

  <footer>
    <p>各系統的算法和完整頁面相同：八字以當地時間排，紫微用 iztro，星座和人類圖用 astronomy-engine，塔羅生日牌依出生年月日加總。</p>
    <p>共同主題是本站把各系統的重點對應到十個主題詞，再看哪些主題在越多系統裡出現。這是幫你整理的角度，不是定論。</p>
    <p>這是一個認識自己的反思工具，不做預測，也不取代專業意見。</p>
  </footer>
</div>

function eclLonOf(body, t, rot) {
  return norm(Astronomy.SphereFromVector(Astronomy.RotateVector(rot, Astronomy.GeoVector(Astronomy.Body[body], t, true))).lon);
}
function sunLon(ms) { const t = Astronomy.MakeTime(new Date(ms)); return eclLonOf("Sun", t, Astronomy.Rotation_EQJ_ECT(t)); }
// 真交點：月球瞬時軌道面和黃道的交點（同 Swiss Ephemeris 的 TRUE_NODE）
function trueNode(t) {
  const s = Astronomy.GeoMoonState(t), rot = Astronomy.Rotation_EQJ_ECT(t);
  const r = Astronomy.RotateVector(rot, new Astronomy.Vector(s.x, s.y, s.z, t));
  const v = Astronomy.RotateVector(rot, new Astronomy.Vector(s.vx, s.vy, s.vz, t));
  return norm(Math.atan2(r.y * v.z - r.z * v.y, -(r.z * v.x - r.x * v.z)) * R2D);
}
function positions(ms) {
  const t = Astronomy.MakeTime(new Date(ms)), rot = Astronomy.Rotation_EQJ_ECT(t), o = {};

  o.Earth = norm(o.Sun + 180); o.NorthNode = trueNode(t); o.SouthNode = norm(o.NorthNode + 180);
  return o;
}
// 設計時間：太陽比出生時倒退 88 度的那一刻
function designTime(birthMs) {

  let lo = birthMs - 96 * 864e5, hi = birthMs - 82 * 864e5;
  for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (f(mid) > 0) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
}
function gateLine(lon) {
  const x = norm(lon - 302), i = Math.floor(x / 5.625);
  return { gate: WHEEL[i % 64], line: Math.min(6, Math.floor((x - i * 5.625) / 0.9375) + 1), lon };
}
function hd(birthMs) {
  const dMs = designTime(birthMs);

  PLANETS.forEach(([k]) => { pers[k] = gateLine(P[k]); des[k] = gateLine(D[k]); });
  const active = new Map(); // 閘門 → { p, d }
  const mark = (acts, who) => Object.values(acts).forEach(a => { const m = active.get(a.gate) || {}; m[who] = true; active.set(a.gate, m); });
  mark(pers, "p"); mark(des, "d");
  const channels = CHANNELS.filter(([a, b]) => active.has(a) && active.has(b));
  const defined = new Set(channels.flatMap(([a, b]) => [GATE_CENTER[a], GATE_CENTER[b]]));
  const adj = {};
  channels.forEach(([a, b]) => { const x = GATE_CENTER[a], y = GATE_CENTER[b]; (adj[x] = adj[x] || new Set()).add(y); (adj[y] = adj[y] || new Set()).add(x); });
  const reach = (from, targets) => { const seen = new Set([from]), q = [from]; while (q.length) { const c = q.shift(); if (targets.includes(c) && c !== from) return true; (adj[c] || []).forEach(n => { if (!seen.has(n)) { seen.add(n); q.push(n); } }); } return false; };
  const motorToThroat = defined.has("throat") && reach("throat", ["heart", "solar", "root", "sacral"]);

function sunLongitude(jd) {
  const T = (jd - 2451545.0) / 36525, r = Math.PI / 180;

  const om = (125.04 - 1934.136 * T) * r;
  return norm(L0 + C - 0.00569 - 0.00478 * Math.sin(om));

function bazi(y, m, d, hh, utcMs) {
  const hasTime = hh !== null;
  const lam = sunLongitude(utcMs / 86400000 + 2440587.5);

  const jdn = Math.round(dayMs / 86400000 + 2440587.5 + 0.5);

  if (hasTime) { const hB = Math.floor((hh + 1) / 2) % 12; hour = [((dS % 5) * 2 + hB) % 10, hB]; }
  return { year: [yS, yB], month: [mS, mB], day: [dS, dB], hour, solarYear: yy };
}

  const mother = Object.keys(GEN).find(k => GEN[k] === dm);
  const total = Object.values(cnt).reduce((a, b) => a + b, 0);
  const ratio = (cnt[dm] + cnt[mother]) / total;
  const strength = ratio >= 0.56 ? "偏強" : ratio <= 0.44 ? "偏弱" : "中和";

  return { cnt, total, dm, mother, strength, needs };
}

// ===== 生日牌 =====
const digits = n => String(n).split("").reduce((a, b) => a + +b, 0);
function birthCards(y, m, d) {
  let n = y + m + d;
  while (n > 22) n = digits(n);
  const chain = [n];
  while (chain[chain.length - 1] > 9 && chain[chain.length - 1] !== 22) chain.push(digits(chain[chain.length - 1]));
  if (n === 22) chain.push(4); // 22 是愚者，再加一次是 4（皇帝）
  return chain.map(x => x === 22 ? 0 : x);
}

// 時辰序號：0 子 … 11 亥。23:00 之後以隔日子時排盤
function toIztroInput(b) {
  let { y, mo, d } = b;
  if (b.hh === 23) { const nx = new Date(Date.UTC(y, mo - 1, d + 1)); y = nx.getUTCFullYear(); mo = nx.getUTCMonth() + 1; d = nx.getUTCDate(); }
  return { date: `${y}-${mo}-${d}`, idx: b.hh === 23 ? 0 : Math.floor((b.hh + 1) / 2) };
}


// ===== 星座 =====
const SIGNS = [["牡羊", "火"], ["金牛", "土"], ["雙子", "風"], ["巨蟹", "水"], ["獅子", "火"], ["處女", "土"], ["天秤", "風"], ["天蠍", "水"], ["射手", "火"], ["摩羯", "土"], ["水瓶", "風"], ["雙魚", "水"]];
const signOf = lon => SIGNS[Math.floor(norm(lon) / 30)];
function ascOf(ms, lat, lon) {
  const t = Astronomy.MakeTime(new Date(ms)), m = Astronomy.Rotation_EQD_ECT(t).rot;
  const e = Math.atan2(m[2][1], m[1][1]), th = norm(Astronomy.SiderealTime(t) * 15 + lon) * D2R, ph = lat * D2R;
  return norm(Math.atan2(Math.cos(th), -(Math.sin(th) * Math.cos(e) + Math.tan(ph) * Math.sin(e))) * R2D);
}

// ===== 計算 =====
function overview(b) {
  const T = []; // { sys, from, tags }
  const out = {};
  const noonOrBirth = localToUtc(b.y, b.mo, b.d, b.noTime ? 12 : b.hh, b.noTime ? 0 : b.mm, b.zone);
  // 八字
  const bz = bazi(b.y, b.mo, b.d, b.noTime ? null : b.hh, noonOrBirth), an = analyze(bz), kg = kua(bz.solarYear, b.sex);
  out.bazi = { bz, an, kg };
  T.push({ sys: "八字", from: `日主${STEMS[bz.day[0]]}${an.dm}`, tags: TAG.dm[an.dm] }, { sys: "八字", from: `底色${an.strength}`, tags: TAG.strength[an.strength] });
  // 紫微（需要時辰）
  if (!b.noTime && typeof iztro !== "undefined") {
    const { date, idx } = toIztroInput(b);
    const a = iztro.astro.bySolar(date, idx, b.sex, true, "zh-TW");
    const i = a.palaces.findIndex(p => p.name === "命宮"), ming = a.palaces[i];
    let mains = ming.majorStars.map(s => s.name), borrowed = false;
    if (!mains.length) { mains = a.palaces[(i + 6) % 12].majorStars.map(s => s.name); borrowed = true; }
    const body = a.palaces.find(p => p.isBodyPalace);
    out.ziwei = { mains, borrowed, branch: ming.earthlyBranch, body: body.name, cls: a.fiveElementsClass };
    mains.forEach(m => T.push({ sys: "紫微", from: `命宮${m}`, tags: TAG.ziwei[m] || [] }));
  }
  // 星座
  const pos = positions(noonOrBirth);
  const sun = signOf(pos.Sun);
  let moon = signOf(pos.Moon), moonAlt = null, asc = null;
  if (b.noTime) {
    const m0 = signOf(positions(localToUtc(b.y, b.mo, b.d, 0, 0, b.zone)).Moon), m1 = signOf(positions(localToUtc(b.y, b.mo, b.d, 23, 59, b.zone)).Moon);
    if (m0 !== m1) moonAlt = [m0, m1];
  } else asc = signOf(ascOf(noonOrBirth, b.lat, b.lon));
  out.star = { sun, moon, moonAlt, asc };
  T.push({ sys: "星座", from: `太陽${sun[0]}`, tags: TAG.el[sun[1]] });
  if (!moonAlt) T.push({ sys: "星座", from: `月亮${moon[0]}`, tags: TAG.el[moon[1]] });
  if (asc) T.push({ sys: "星座", from: `上升${asc[0]}`, tags: TAG.el[asc[1]] });
  // 人類圖
  let R = hd(noonOrBirth), range = null;
  if (b.noTime) {
    range = { type: new Set(), auth: new Set(), profile: new Set() };
    for (let h = 0; h < 24; h++) { const x = hd(localToUtc(b.y, b.mo, b.d, h, 30, b.zone)); range.type.add(x.type); range.auth.add(x.auth); range.profile.add(x.profile.join("/")); }
  }
  out.hd = { R, range };
  if (!range || range.type.size === 1) T.push({ sys: "人類圖", from: R.type, tags: TAG.type[R.type] });
  if (!range || range.auth.size === 1) T.push({ sys: "人類圖", from: R.auth, tags: TAG.auth[R.auth] });
  // 塔羅
  const chain = birthCards(b.y, b.mo, b.d);
  out.tarot = chain;
  [...new Set([chain[0], chain[chain.length - 1]])].forEach(n => T.push({ sys: "塔羅", from: MAJOR[n][0], tags: TAG.tarot[n] }));
  // 共同主題：先看出現在幾個系統，再看出現幾次
  const score = {};
  T.forEach(t => t.tags.forEach(g => { const s = score[g] = score[g] || { sys: new Set(), from: [] }; s.sys.add(t.sys); s.from.push([t.sys, t.from]); }));
  const sorted = Object.entries(score).sort((x, y) => y[1].sys.size - x[1].sys.size || y[1].from.length - x[1].from.length);
  const shared = sorted.filter(([, s]) => s.sys.size >= 2).slice(0, 3);
  const ranked = shared.length ? shared : sorted.slice(0, 1); // 至少兩個系統都提到的主題；都沒有時只列最常出現的一個
  return { out, ranked };
}

        <div class="chips">${s.from.map(([sys, f]) => `<span class="chip" style="--c:var(${SYS[sys]})">${sys}・${f}</span>`).join("")}</div></div>`).join("")}</div>

    </section>
    <section aria-labelledby="sys-h" style="display:grid;gap:14px">
      <h2 id="sys-h" style="font-size:22px">五個系統的重點</h2>
      <div class="systems">
        ${card("八字", `${STEMS[bz.day[0]]}${an.dm}日主，底色${an.strength}`, [`四柱：${pill(bz.year)}・${pill(bz.month)}・${pill(bz.day)}・${pill(bz.hour)}`, `五行：${ELS.map(e => `${e}${an.cnt[e]}`).join("　")}`, `八宅命卦：${kg.name}卦，${kg.group}`], "wuxing-wengua.html", "用生辰問一件事", tagsOf("八字"))}

        ${card("塔羅", chain.map(n => `${ROMAN[n]} ${MAJOR[n][0]}`).join("・"), [chain.length === 1 ? "人格牌和靈魂牌是同一張。" : `人格牌${MAJOR[chain[0]][0]}，靈魂牌${MAJOR[chain[chain.length - 1]][0]}。`, MAJOR[chain[0]][4]], "taluo.html#birth", "看塔羅生日牌", tagsOf("塔羅"))}

function fillTimeSelect(sel, n, unit) {

fillTimeSelect($("btH"), 24, "時"); fillTimeSelect($("btM"), 60, "分");
$("city").innerHTML = CITIES.map(([g, list]) => `<optgroup label="${g}">${list.map(c => `<option value="${c[0]}">${c[0]}</option>`).join("")}</optgroup>`).join("");
function setTime(t) { const [h = "", m = ""] = (t || "").split(":"); $("btH").value = h; $("btM").value = m; }
function syncTime() { $("btH").disabled = $("btM").disabled = $("noTime").checked; }
function readBirth() {
  const d = $("bd").value, h = $("btH").value, m = $("btM").value, noTime = $("noTime").checked, city = $("city").value;
  if (!d) return { err: "請先填出生日期。" };
  const [y, mo, dd] = d.split("-").map(Number);
  if (y < 1901 || y > 2099) return { err: "目前支援 1901 到 2099 年出生。" };
  if (!noTime && (!h || !m)) return { err: "請選出生的時和分，或勾選「不知道出生時間」。" };
  const [, lat, lon, zone] = CITY_BY[city], sex = $("sexM").checked ? "男" : "女", name = $("nm").value.trim();
  return { y, mo, d: dd, hh: +h, mm: +m, noTime, lat, lon, zone, sex, name, raw: { d, t: noTime ? "" : `${h}:${m}`, noTime, city, sex, name } };
}
let isSample = true;
function calc(b) {
  let res;
  try { res = overview(b); } catch (e) { $("err").textContent = "這組資料排不出來，請檢查日期和時間。"; return; }
  $("err").textContent = "";

}
$("calcBtn").addEventListener("click", () => {

});

isSample = !saved;
$("bd").value = start.d; setTime(start.t); $("noTime").checked = !!start.noTime; $("nm").value = start.name || "";

<script>

(() => {

  const lines = Array.from({ length: 56 }, (_, i) => ({ c: COLORS[i % 3], w: .6 + rnd() * 1.1, a: .22 + rnd() * .28, off: rnd() - .5,
    spread: .5 + rnd() * .9, f1: 1.2 + rnd() * 2.2, f2: 3 + rnd() * 4, p1: rnd() * 6.28, p2: rnd() * 6.28, amp: (rnd() < .12 ? .7 : .12) + rnd() * .45 }));
