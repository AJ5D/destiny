<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掌上命珠</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* 版面：大字、單欄、留白。上方是名字，下方三個工具各佔一列，用細線分隔 */
/* 配色：淺灰綠底、墨色字、朱紅點睛，固定淺色，不隨系統切換深色 */
:root {
  --paper: #F1F3EF; --ink: #1B2220; --muted: #5B6661; --rule: #D4DAD5; --accent: #2C6B5E; --mark: #B0432D;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box }
html { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px) }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.7;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: clamp(48px, 12vh, 120px) 64px }
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: clamp(56px, 10vw, 96px) }
p { margin: 0 }

header { display: grid; gap: 20px }
h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(64px, 17vw, 160px); line-height: 1; letter-spacing: .02em }
h1 .zhu { color: var(--mark) }
.lede { font-size: clamp(18px, 2.6vw, 22px); color: var(--muted); max-width: 26em }

nav ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink) }
nav li { border-bottom: 1px solid var(--rule) }
nav a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 24px; padding: clamp(20px, 4vw, 32px) 0; color: inherit; text-decoration: none }
nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px }
nav h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(32px, 7vw, 56px); line-height: 1.15; letter-spacing: .03em; transition: color .2s }
nav p { grid-column: 1; color: var(--muted); min-width: 0 }
nav .go { grid-column: 2; grid-row: 1 / span 2; font-size: clamp(24px, 5vw, 36px); color: var(--muted); transition: transform .2s, color .2s }
nav a:hover h2, nav a:focus-visible h2 { color: var(--accent) }
nav a:hover .go, nav a:focus-visible .go { color: var(--accent); transform: translateX(6px) }

footer { font-size: 14px; color: var(--muted) }
@media (prefers-reduced-motion: reduce) { nav h2, nav .go { transition: none } nav a:hover .go { transform: none } }
</style>

<div class="wrap">
  <header>
    <h1>掌上命<span class="zhu">珠</span></h1>
    <p class="lede">命運在你自己的掌心。<br>這裡的工具不替你算命，只幫你換個角度看自己。</p>
  </header>

  <nav aria-label="工具">
    <ul>
      <li><a href="wuxing-wengua.html">
        <h2>五行問卦</h2>
        <p>心裡有一件事，擲六次硬幣起一卦，看這件事的天氣。</p>
        <span class="go" aria-hidden="true">→</span>
      </a></li>
      <li><a href="wuxing-hepan.html">
        <h2>五行合盤</h2>
        <p>用生辰看你的底色，再配上一卦，看這件事對你是補，還是耗。</p>
        <span class="go" aria-hidden="true">→</span>
      </a></li>
      <li><a href="ziwei-mingpan.html">
        <h2>紫微命盤</h2>
        <p>排出十二宮命盤，看看自己的個性、關係和人生的節奏。</p>
        <span class="go" aria-hidden="true">→</span>
      </a></li>
    </ul>
  </nav>

  <footer>
    <p>這些都是反思工具，不做預測，也不取代專業意見。你輸入的生辰和紀錄只存在自己的瀏覽器裡。</p>
  </footer>
</div>
